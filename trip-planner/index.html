<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Three places, one wildcard</title>
<style>
:root{
  --ink:#101B21; --paper:#EDEFEA; --card:#FFF;
  --deep:#0E3B3C; --glacier:#2E7D74; --ochre:#C25A22; --sand:#E4DCC9;
  --fade:#6E7C79; --line:#C9D2CD; --wash:#F6F3EC;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding:0 18px 70px}
.top{padding:38px 0 22px}
.kicker{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--ochre)}
h1{font-family:var(--serif);font-size:clamp(34px,8vw,52px);line-height:1;font-weight:400;letter-spacing:-.02em;margin:13px 0 14px}
h1 em{font-style:italic;color:var(--glacier)}
.sub{font-size:16px;color:var(--fade);max-width:34em}
.blk{background:var(--card);border:1px solid var(--line);padding:20px 18px;margin-bottom:11px}
.blk>.lab{display:flex;align-items:baseline;gap:9px;margin-bottom:14px}
.blk .n{font-family:var(--mono);font-size:11px;color:var(--ochre);letter-spacing:.1em}
.blk h2{font-family:var(--serif);font-size:21px;font-weight:400;line-height:1.15}
.tip{font-size:13px;color:var(--fade);margin-top:9px;line-height:1.45}
label.f{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--fade);margin:16px 0 8px}
input[type=text],textarea,select{width:100%;font:inherit;font-size:16px;padding:12px 13px;background:var(--paper);border:1px solid var(--line);border-radius:0;color:var(--ink)}
textarea{min-height:96px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:2px solid var(--glacier);outline-offset:-1px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font:inherit;font-size:14px;padding:9px 13px;background:var(--paper);border:1px solid var(--line);color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent}
.chip[aria-pressed=true]{background:var(--deep);border-color:var(--deep);color:#fff}
.chip.ghost{background:transparent;border-style:dashed;color:var(--fade);font-size:13px}
.chip:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--ink);margin-bottom:11px}
.mode button{font:inherit;font-size:14.5px;padding:14px 8px;background:transparent;border:0;cursor:pointer;color:var(--ink);border-right:1px solid var(--ink)}
.mode button:last-child{border-right:0}
.mode button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.step{display:flex;align-items:center;gap:12px}
.step .b{width:42px;height:42px;font-size:20px;background:var(--paper);border:1px solid var(--line);cursor:pointer;color:var(--ink)}
.step .v{font-family:var(--mono);font-size:17px;min-width:30px;text-align:center}
.step .t{font-size:15px;color:var(--fade)}
.kid{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.kid .who{font-size:15px;flex:1}
.kid .x{background:none;border:0;color:var(--fade);font-size:19px;cursor:pointer;padding:4px 8px}
.cal{margin-top:14px;border:1px solid var(--line);background:var(--paper)}
.calhead{display:flex;align-items:center;justify-content:space-between;padding:9px 11px;border-bottom:1px solid var(--line)}
.calhead b{font-family:var(--mono);font-size:12px;letter-spacing:.08em;font-weight:400}
.calhead button{background:none;border:0;font-size:19px;cursor:pointer;padding:2px 11px;color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.grid span.dow{background:var(--paper);font-family:var(--mono);font-size:9.5px;text-align:center;padding:6px 0;color:var(--fade)}
.grid button{background:var(--card);border:0;padding:11px 0;font:inherit;font-size:13.5px;cursor:pointer;color:var(--ink)}
.grid button.off{color:var(--line);cursor:default}
.grid button.on{background:var(--glacier);color:#fff}
.calfoot{display:flex;justify-content:space-between;align-items:center;padding:9px 11px;font-family:var(--mono);font-size:11px;color:var(--fade)}
.calfoot button{background:none;border:0;font:inherit;font-size:11px;color:var(--glacier);cursor:pointer;text-decoration:underline}
.tog{display:flex;gap:11px;align-items:flex-start;margin-top:15px;cursor:pointer}
.tog input{width:19px;height:19px;margin-top:2px;accent-color:var(--deep);flex:0 0 auto}
.tog span{font-size:14.5px;line-height:1.45}
.go{font:inherit;font-size:17px;font-weight:600;width:100%;padding:19px;border:0;background:var(--deep);color:#fff;cursor:pointer;margin-top:6px}
.go:hover{background:var(--glacier)}
.working{padding:64px 0}
.working .now{font-family:var(--serif);font-size:27px;font-weight:400;margin-bottom:22px}
.steps{font-family:var(--mono);font-size:12.5px;line-height:2.1;color:var(--line)}
.steps .done{color:var(--fade)} .steps .live{color:var(--ochre)}
.steps .live::after{content:' \\258D';animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.snap{background:var(--card);border:1px solid var(--line);margin-bottom:9px}
.snapbtn{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 20px;background:none;border:0;cursor:pointer;text-align:left;font:inherit;color:var(--ink)}
.snapbtn .l{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--fade)}
.snapbtn .t{font-size:14.5px;margin-top:5px;line-height:1.4}
.snapbtn .c{font-family:var(--mono);font-size:19px;color:var(--glacier);flex:0 0 auto}
.snapbody{border-top:1px solid var(--line);padding:14px 14px 16px;overflow-x:auto}
table.cmp{width:100%;border-collapse:collapse;font-size:13px}
table.cmp th{font-family:var(--serif);font-size:15px;font-weight:400;text-align:center;padding:0 6px 10px;vertical-align:bottom;line-height:1.15}
table.cmp th:first-child{width:84px}
table.cmp td{padding:8px 6px;text-align:center;border-top:1px solid var(--line)}
table.cmp td:first-child{text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--fade)}
.est{font-family:var(--mono);font-size:10px;color:var(--ochre);margin-top:12px;line-height:1.6}
.verdict{background:var(--deep);color:var(--paper);padding:26px 22px;margin-bottom:9px}
.verdict .kicker{color:var(--sand)}
.verdict p{font-family:var(--serif);font-size:21px;line-height:1.32;margin-top:11px}
.opt{background:var(--card);border:1px solid var(--line);margin-bottom:9px}
.band{display:flex;justify-content:space-between;gap:12px;padding:11px 20px;background:var(--sand);font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase}
.opt.wild .band{background:var(--ochre);color:#fff}
.unver{background:#FDF1EC;border-bottom:1px solid var(--ochre);padding:9px 20px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--ochre)}
.shots{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:var(--line)}
.shots.one{grid-template-columns:1fr}
.shot{position:relative;background:var(--sand);aspect-ratio:4/3;overflow:hidden}
.shots.one .shot{aspect-ratio:16/9}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot .cap{position:absolute;left:0;right:0;bottom:0;padding:14px 8px 5px;background:linear-gradient(transparent,rgba(16,27,33,.82));color:#fff;font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase}
.shot .cred{position:absolute;top:5px;right:6px;font-family:var(--mono);font-size:8px;color:#fff;background:rgba(16,27,33,.55);padding:2px 5px}
.shot .cred a{color:#fff;text-decoration:none}
.in{padding:22px 20px 24px}
.opt h2{font-family:var(--serif);font-size:32px;font-weight:400;line-height:1.06;letter-spacing:-.015em}
.place{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--fade);margin-top:8px}
.pitch{font-family:var(--serif);font-size:18.5px;line-height:1.45;margin-top:15px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);margin-top:20px}
.stats div{background:var(--card);padding:11px 12px}
.stats .k{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--fade)}
.stats .v{font-size:15.5px;margin-top:4px;line-height:1.3}
.vs{margin-top:20px;background:var(--wash);padding:14px 15px}
.vs .h{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ochre)}
.vs p{font-size:15px;line-height:1.55;margin-top:7px}
.sec{margin-top:20px}
.sec .h{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--fade);padding-bottom:7px;border-bottom:1px solid var(--line);margin-bottom:10px}
.sec ul{list-style:none}
.sec li{font-size:15px;line-height:1.55;padding:5px 0 5px 17px;position:relative}
.sec li::before{content:'';position:absolute;left:0;top:12px;width:7px;height:1px;background:var(--glacier)}
.risk li::before{background:var(--ochre)}
.risk li b{font-weight:600} .risk li span{color:var(--fade);display:block;font-size:14px;margin-top:2px}
.trade{background:var(--wash);border-left:3px solid var(--ochre);padding:12px 14px;font-size:15px;line-height:1.5;margin-top:18px}
.say{margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.say .h{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--fade)}
.say p{font-family:var(--serif);font-style:italic;font-size:19.5px;line-height:1.35;margin-top:8px}
.map{width:100%;height:190px;border:1px solid var(--line);margin-top:20px;display:block}
.check{font-family:var(--mono);font-size:12px;line-height:1.8;color:var(--fade);margin-top:18px;padding-top:15px;border-top:1px dashed var(--line)}
.fold{width:100%;margin-top:18px;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border:1px solid var(--line);background:var(--paper);font:inherit;font-size:14px;cursor:pointer;color:var(--ink)}
.fold .c{font-family:var(--mono);font-size:17px;color:var(--glacier)}
.folded{display:none} .folded.open{display:block}
.short{border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr}
.short button{font:inherit;font-size:14px;padding:14px;background:none;border:0;border-right:1px solid var(--line);cursor:pointer;color:var(--ink)}
.short button:last-child{border-right:0}
.short button[aria-pressed=true]{background:var(--deep);color:#fff}
.tune{border-top:1px solid var(--line);padding:14px 20px;background:var(--wash)}
.tune .h{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--fade);margin-bottom:9px}
.foot{margin-top:22px;padding:18px 20px;background:var(--card);border:1px solid var(--line);font-size:14px;line-height:1.6;color:var(--fade)}
.foot b{color:var(--ink);font-weight:600}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
.acts button{font:inherit;font-size:15px;padding:15px;background:transparent;color:var(--ink);border:1px solid var(--ink);cursor:pointer}
.err{background:#FDF1EC;border:1px solid var(--ochre);padding:18px;font-size:15px;line-height:1.55}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const ENDPOINT='https://trip-planner.heystevenridgeway.workers.dev';   /* <-- your worker URL */

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
const AIRPORTS=['Any London airport','Heathrow','Gatwick','Stansted','Luton','London City','Southend','Manchester','Birmingham','Bristol','Liverpool','Leeds Bradford','East Midlands','Newcastle','Edinburgh','Glasgow','Aberdeen','Belfast','Cardiff','Southampton','Bournemouth','Exeter','Norwich','Anywhere in the UK'];
const WINDOWS={'February half term':[[1,7],[1,22]],'Easter':[[2,25],[3,18]],'May half term':[[4,20],[4,31]],'Summer holidays':[[6,15],[7,31]],'October half term':[[9,15],[9,31]],'Christmas':[[11,17],[11,31]]};
const APPETITE={
 'Swimming in lakes':'swimming in lakes','Mountain coasters':'mountain coasters and toboggan runs',
 'Cable cars':'cable cars and mountain railways','Animals':'animals and wildlife',
 'Water parks':'water parks and pools','Zip lines':'zip lines and high ropes',
 'Caves and gorges':'caves and gorges','Boats':'boats and lake ferries',
 'Trains':'train journeys','Long walks':'long walks','Snow in summer':'snow in summer',
 'Cycling':'cycling','Beaches':'beaches','Castles':'castles and ruins',
 'Markets and food':'markets and eating out','Just running about':'somewhere to just run about'};
const COUNTRIES=['Spain','France','Italy','Greece','Portugal','Switzerland','Austria','Germany','Croatia','Slovenia','Netherlands','Ireland','Turkey','Morocco','USA','Canada','Costa Rica','Sri Lanka','Japan','Thailand'];

const B={mode:'open',where:'',adults:2,kids:[],year:new Date().getFullYear()+1,days:new Set(),calMonth:7,
  nightsMin:7,nightsMax:10,avoidFirstWeek:false,airport:'Any London airport',flight:[],bases:'',
  appetite:[],loved:'',lovedPlaces:[],been:[],ruledText:'',budget:'',budgetCap:'',ruin:[]};
let LAST=null, anchor=null, timer, SNAP=false;
const SHORT=new Set();

/* ============================ form ============================ */
function form(){
  app.innerHTML=`
  <div class="top">
    <div class="kicker">Where should we go</div>
    <h1>Three places worth<br>arguing about.<em> And one<br>that shouldn't work.</em></h1>
    <p class="sub">Tell it what your family actually enjoyed. It works out what that means, then finds somewhere the British mostly haven't reached.</p>
  </div>

  <div class="mode" id="mode">
    <button data-m="open">Open to anywhere</button>
    <button data-m="known">We know roughly where</button>
  </div>
  <div id="wherebox"></div>

  <div class="blk">
    <div class="lab"><span class="n">01</span><h2>Who's going</h2></div>
    <label class="f">Adults</label>
    <div class="step"><button class="b" data-a="-1">&#8211;</button><span class="v" id="ad">${B.adults}</span><button class="b" data-a="1">+</button></div>
    <label class="f">Children &#8212; age when you travel</label>
    <div id="kids"></div>
    <div class="chips" style="margin-top:10px"><button class="chip ghost" id="addkid">+ Add a child</button></div>
    <p class="tip">Age at the time of the trip, not today. Half years count &#8212; a great many rides start at six.</p>
  </div>

  <div class="blk">
    <div class="lab"><span class="n">02</span><h2>When, roughly</h2></div>
    <label class="f">Year</label><div class="chips" id="years"></div>
    <label class="f">Start from a window</label><div class="chips" id="wins"></div>
    <div id="calbox"></div>
    <label class="f">Nights away</label>
    <div class="step">
      <button class="b" data-n="min-">&#8211;</button><span class="v" id="nmin">${B.nightsMin}</span><button class="b" data-n="min+">+</button>
      <span class="t">to</span>
      <button class="b" data-n="max-">&#8211;</button><span class="v" id="nmax">${B.nightsMax}</span><button class="b" data-n="max+">+</button>
    </div>
    <label class="tog"><input type="checkbox" id="avoid" ${B.avoidFirstWeek?'checked':''}>
      <span>Skip the first week of the school holidays &#8212; everyone's knackered and the airports are a bun fight.</span></label>
  </div>

  <div class="blk">
    <div class="lab"><span class="n">03</span><h2>Getting there, and staying put</h2></div>
    <label class="f">Flying from</label>
    <select id="air">${AIRPORTS.map(a=>`<option ${a===B.airport?'selected':''}>${a}</option>`).join('')}</select>
    <label class="f">Limits on the flight</label><div class="chips" id="flight"></div>
    <label class="f">How many bases</label><div class="chips" id="bases"></div>
    <p class="tip">One base means unpacking once and day-tripping. Three means more variety and more packing.</p>
  </div>

  <div class="blk">
    <div class="lab"><span class="n">04</span><h2>What your family actually enjoyed</h2></div>
    <label class="f">Tap what they went back for</label>
    <div class="chips" id="appetite"></div>
    <label class="f">And in your own words</label>
    <textarea id="loved" placeholder="Costa Rica two years ago &#8212; the kids loved zip lining and cave tubing. Switzerland last summer, they lived on the mountain coasters and we swam in the lake.">${esc(B.loved)}</textarea>
    <p class="tip">It works out what <em>kind</em> of thing that is, then finds the local version. A child who loves cave tubing will love a gorge walk, and there is nothing to tube in Austria.</p>
  </div>

  <div class="blk">
    <div class="lab"><span class="n">05</span><h2>Places you loved, places you've done</h2></div>
    <label class="f">Loved it &#8212; find us that feeling again</label><div class="chips" id="lovedPlaces"></div>
    <label class="f">Been there &#8212; don't send us back</label><div class="chips" id="been"></div>
    <label class="f">Anything else</label>
    <input type="text" id="ruledText" placeholder="Bern and Lauterbrunnen specifically. Never again an all-inclusive." value="${esc(B.ruledText)}">
    <p class="tip">These pull in opposite directions on purpose. Somewhere can be on both &#8212; that means find the same feeling somewhere new.</p>
  </div>

  <div class="blk">
    <div class="lab"><span class="n">06</span><h2>Money, and dealbreakers</h2></div>
    <label class="f">How you'd rather spend</label><div class="chips" id="budget"></div>
    <label class="f">A ceiling, if you have one</label>
    <input type="text" id="budgetCap" placeholder="Under &#163;6,000 all in" value="${esc(B.budgetCap)}">
    <label class="f">What would ruin it</label><div class="chips" id="ruin"></div>
  </div>

  <button class="go" id="run">Find three options</button>
  <p class="tip" style="text-align:center;margin-top:12px">About half a minute. You can steer it afterwards.</p>`;

  drawMode();drawKids();drawYears();drawWindows();drawCal();
  multi('#flight',['Direct only','Under 4 hours','One connection is fine'],B.flight);
  multi('#lovedPlaces',COUNTRIES,B.lovedPlaces);
  multi('#been',COUNTRIES,B.been);
  multi('#ruin',['Long transfer','Nowhere to buy food','Car needed','Too busy','Too remote','Nothing to do in the rain','Late-night flights'],B.ruin);
  single('#budget',['Cheapest that works','Good value','Best trip, price second'],'budget');
  single('#bases',['One base, well connected','Two bases','Three, different vibes','Not sure'],'bases');
  appetiteTiles();

  $$('.b[data-a]').forEach(b=>b.onclick=()=>{B.adults=Math.max(1,Math.min(8,B.adults+ +b.dataset.a));$('#ad').textContent=B.adults;});
  $('#addkid').onclick=()=>{B.kids.push(8);drawKids();};
  $$('.b[data-n]').forEach(b=>b.onclick=()=>{
    const d=b.dataset.n,up=d.endsWith('+'),k=d.startsWith('min')?'nightsMin':'nightsMax';
    B[k]=Math.max(2,Math.min(30,B[k]+(up?1:-1)));
    if(B.nightsMax<B.nightsMin)B.nightsMax=B.nightsMin;
    $('#nmin').textContent=B.nightsMin;$('#nmax').textContent=B.nightsMax;});
  $('#avoid').onchange=e=>B.avoidFirstWeek=e.target.checked;
  $('#air').onchange=e=>B.airport=e.target.value;
  $('#run').onclick=()=>{
    B.loved=$('#loved').value.trim();B.ruledText=$('#ruledText').value.trim();B.budgetCap=$('#budgetCap').value.trim();
    if(!B.loved && !B.appetite.length){alert('Box four is the one that matters \u2014 tap a few things or write a line.');return;}
    run(null);
  };
}

function drawMode(){
  $$('#mode button').forEach(b=>{
    b.setAttribute('aria-pressed',B.mode===b.dataset.m);
    b.onclick=()=>{B.mode=b.dataset.m;drawMode();drawWhere();};
  });
  drawWhere();
}
function drawWhere(){
  const el=$('#wherebox');if(!el)return;
  el.innerHTML=B.mode==='known'?`<div class="blk">
    <label class="f" style="margin-top:0">Roughly where</label>
    <input type="text" id="where" placeholder="Switzerland. Or the Alps. Or northern Italy." value="${esc(B.where)}">
    <p class="tip">It will find three regions or valleys inside that, rather than three countries.</p></div>`:'';
  if(B.mode==='known') $('#where').oninput=e=>B.where=e.target.value;
}
function appetiteTiles(){
  const el=$('#appetite');el.innerHTML='';
  Object.keys(APPETITE).forEach(k=>{
    const b=document.createElement('button');b.className='chip';b.textContent=k;
    b.setAttribute('aria-pressed',B.appetite.includes(k));
    b.onclick=()=>{
      const i=B.appetite.indexOf(k);i<0?B.appetite.push(k):B.appetite.splice(i,1);
      b.setAttribute('aria-pressed',i<0);compose();
    };
    el.appendChild(b);
  });
}
function compose(){
  const t=$('#loved');if(!t)return;
  const line=B.appetite.length?'They loved '+B.appetite.map(k=>APPETITE[k]).join(', ').replace(/, ([^,]*)$/,' and $1')+'.':'';
  const rest=t.value.replace(/^They loved [^\n]*\n?/,'');
  t.value=(line?line+(rest?'\n':''):'')+rest;
}
function drawKids(){
  const el=$('#kids');if(!el)return;
  el.innerHTML=B.kids.length?B.kids.map((a,i)=>`<div class="kid"><span class="who">Child ${i+1}</span>
    <div class="step"><button class="b" data-k="${i}" data-d="-1">&#8211;</button>
    <span class="v">${a%1?a.toFixed(1):a}</span>
    <button class="b" data-k="${i}" data-d="1">+</button></div>
    <button class="x" data-rm="${i}" aria-label="Remove">&#215;</button></div>`).join('')
    :'<p class="tip" style="margin:0">None added yet.</p>';
  $$('[data-k]').forEach(b=>b.onclick=()=>{const i=+b.dataset.k;B.kids[i]=Math.max(0,Math.min(19,B.kids[i]+(+b.dataset.d)*0.5));drawKids();});
  $$('[data-rm]').forEach(b=>b.onclick=()=>{B.kids.splice(+b.dataset.rm,1);drawKids();});
}
function drawYears(){
  const y=new Date().getFullYear(),el=$('#years');el.innerHTML='';
  [y,y+1,y+2].forEach(yy=>{const b=document.createElement('button');b.className='chip';b.textContent=yy;
    b.setAttribute('aria-pressed',B.year===yy);
    b.onclick=()=>{B.year=yy;B.days.clear();anchor=null;drawYears();drawCal();};el.appendChild(b);});
}
function drawWindows(){
  const el=$('#wins');el.innerHTML='';
  Object.keys(WINDOWS).forEach(k=>{
    const b=document.createElement('button');b.className='chip';b.textContent=k;
    b.onclick=()=>{const[[m1,d1],[m2,d2]]=WINDOWS[k];B.days.clear();B.calMonth=m1;anchor=null;
      let c=new Date(B.year,m1,d1),end=new Date(B.year,m2,d2);
      while(c<=end){B.days.add(`${c.getFullYear()}-${c.getMonth()}-${c.getDate()}`);c.setDate(c.getDate()+1);}
      drawCal();};
    el.appendChild(b);});
  const p=document.createElement('button');p.className='chip ghost';p.textContent='Pick it myself';
  p.onclick=()=>{B.days.clear();anchor=null;drawCal();};el.appendChild(p);
}
function drawCal(){
  const box=$('#calbox');if(!box)return;
  const m=B.calMonth,start=(new Date(B.year,m,1).getDay()+6)%7,len=new Date(B.year,m+1,0).getDate();
  let cells='';['M','T','W','T','F','S','S'].forEach(d=>cells+=`<span class="dow">${d}</span>`);
  for(let i=0;i<start;i++)cells+='<button class="off" disabled></button>';
  for(let d=1;d<=len;d++)cells+=`<button data-d="${d}" class="${B.days.has(`${B.year}-${m}-${d}`)?'on':''}">${d}</button>`;
  box.innerHTML=`<div class="cal">
    <div class="calhead"><button data-m="-1">&#8249;</button><b>${MON[m]} ${B.year}</b><button data-m="1">&#8250;</button></div>
    <div class="grid">${cells}</div>
    <div class="calfoot"><span>${B.days.size} days in the window</span>
    <span><button data-all>Whole month</button> &#183; <button data-clear>Clear</button></span></div></div>`;
  box.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{B.calMonth=(B.calMonth+ +b.dataset.m+12)%12;anchor=null;drawCal();});
  box.querySelector('[data-all]').onclick=()=>{for(let d=1;d<=len;d++)B.days.add(`${B.year}-${m}-${d}`);drawCal();};
  box.querySelector('[data-clear]').onclick=()=>{B.days.clear();anchor=null;drawCal();};
  box.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{
    const d=+b.dataset.d;
    if(anchor===null){B.days.clear();B.days.add(`${B.year}-${m}-${d}`);anchor=d;}
    else{const a=Math.min(anchor,d),z=Math.max(anchor,d);B.days.clear();
      for(let x=a;x<=z;x++)B.days.add(`${B.year}-${m}-${x}`);anchor=null;}
    drawCal();});
}
function multi(sel,opts,store){
  const el=$(sel);el.innerHTML='';
  opts.forEach(o=>{const b=document.createElement('button');b.className='chip';b.textContent=o;
    b.setAttribute('aria-pressed',store.includes(o));
    b.onclick=()=>{const i=store.indexOf(o);i<0?store.push(o):store.splice(i,1);b.setAttribute('aria-pressed',i<0);};
    el.appendChild(b);});
}
function single(sel,opts,field){
  const el=$(sel);el.innerHTML='';
  opts.forEach(o=>{const b=document.createElement('button');b.className='chip';b.textContent=o;
    b.setAttribute('aria-pressed',B[field]===o);
    b.onclick=()=>{B[field]=B[field]===o?'':o;single(sel,opts,field);};el.appendChild(b);});
}

/* ============================ brief ============================ */
function windowText(){
  if(!B.days.size)return `${B.year}, dates open`;
  const ds=[...B.days].map(k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m,d);}).sort((a,b)=>a-b);
  const f=ds[0],l=ds[ds.length-1];
  return `any ${B.nightsMin===B.nightsMax?B.nightsMin:B.nightsMin+'\u2013'+B.nightsMax} nights inside ${f.getDate()} ${MON[f.getMonth()]} \u2013 ${l.getDate()} ${MON[l.getMonth()]} ${B.year}`;
}
function brief(){
  return {
    mode:B.mode, where:B.where,
    travellers:`${B.adults} adult${B.adults>1?'s':''}`+(B.kids.length?`, children aged ${B.kids.map(a=>a%1?a.toFixed(1):a).join(' and ')} at the time of travel`:', no children'),
    window:windowText(),
    nights:B.nightsMin===B.nightsMax?`${B.nightsMin} nights`:`${B.nightsMin} to ${B.nightsMax} nights`,
    avoidFirstWeek:B.avoidFirstWeek, airport:B.airport, flight:B.flight, bases:B.bases,
    loved:B.loved,
    loved_places:B.lovedPlaces.join(', '),
    been:B.been.join(', '),
    ruled:B.ruledText,
    budget:[B.budget,B.budgetCap].filter(Boolean).join(' \u2014 '), ruin:B.ruin
  };
}

/* ============================ run ============================ */
const STEPS=['Reading what your family enjoyed','Working out what kind of thing that is','Casting wide \u2014 forty candidates','Dropping the places everyone gets sent to','Ruling out what the ages rule out','Finding a photograph of each','Writing the three, and the wildcard'];
function working(msg){
  app.innerHTML=`<div class="working"><p class="now">${msg}</p>
    <div class="steps">${STEPS.map((s,i)=>`<div id="s${i}">${s}</div>`).join('')}</div></div>`;
  let n=0;const go=()=>{if(n>0)document.getElementById('s'+(n-1))?.classList.replace('live','done');
    if(n<STEPS.length)document.getElementById('s'+n)?.classList.add('live');n++;};
  go();timer=setInterval(go,4600);
}
async function run(feedback){
  working(feedback?'Adjusting.':'Looking.');
  try{
    const r=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({brief:brief(),previous:feedback?LAST:null,feedback:feedback||null})});
    if(!r.ok)throw new Error('The planner returned '+r.status);
    const d=await r.json();
    if(d.error)throw new Error(d.error);
    clearInterval(timer);LAST=d;results(d);
  }catch(e){
    clearInterval(timer);
    app.innerHTML=`<div class="top"><h1>That didn't work.</h1></div>
      <div class="err"><b>${esc(e.message)}</b><br><br>Check ENDPOINT in the source points at your worker.</div>
      <div class="acts"><button onclick="form()">Back to the brief</button></div>`;
  }
}

/* ============================ results ============================ */
const TUNE=['More like this','Less remote','Cheaper','More for the kids','Quieter','Shorter transfer','Somewhere else entirely'];

function snapshot(d){
  let all=[...(d.options||[]),...(d.wildcard?[d.wildcard]:[])];
  const focused=SHORT.size>=2;
  if(focused) all=all.filter(o=>SHORT.has(o.name));
  if(all.length<2) return '';
  const keys=[];
  all.forEach(o=>Object.keys(o.stats||{}).forEach(k=>{if(!keys.includes(k))keys.push(k);}));
  const rows=keys.filter(k=>new Set(all.map(o=>((o.stats||{})[k]||'').toLowerCase().trim())).size>1);
  if(!rows.length) return '';
  const k=rows[0];
  const teaser=`${k.toLowerCase()} \u2014 ${all.map(o=>`${o.name.split(/[ ,]/)[0]} ${(o.stats||{})[k]||''}`.trim()).join(' \u00b7 ')}`;
  return `<div class="snap">
    <button class="snapbtn" id="snaptog">
      <span><span class="l">${focused?'Your two, side by side':'Side by side'}</span>
      <span class="t">${esc(teaser)}</span></span><span class="c">${SNAP?'\u2212':'+'}</span></button>
    ${SNAP?`<div class="snapbody"><table class="cmp">
      <tr><th></th>${all.map(o=>`<th>${esc(o.name)}</th>`).join('')}</tr>
      ${rows.map(r=>`<tr><td>${esc(r)}</td>${all.map(o=>`<td>${esc((o.stats||{})[r]||'\u2014')}</td>`).join('')}</tr>`).join('')}
    </table>
    <p class="est">Every figure here is the planner's estimate. Nothing has been checked against an operator, a timetable or a statistics office.</p>
    </div>`:''}</div>`;
}

function card(o,i,wild){
  const id=esc(o.name).replace(/\W/g,'');
  const shots=(o.images||[]).slice(0,3);
  const gal=shots.length?`<div class="shots ${shots.length===1?'one':''}">${shots.map(im=>`
    <figure class="shot"><img src="${esc(im.url)}" alt="${esc(im.label||o.name)}" loading="lazy">
      ${im.label?`<figcaption class="cap">${esc(im.label)}</figcaption>`:''}
      <span class="cred">${im.link?`<a href="${esc(im.link)}" target="_blank" rel="noopener">${esc(im.credit)}</a>`:esc(im.credit)}</span>
    </figure>`).join('')}</div>`:'';
  const st=o.stats||{};
  const grid=Object.keys(st).length?`<div class="stats">${Object.entries(st).map(([k,v])=>
    `<div><div class="k">${esc(k)}</div><div class="v">${esc(v||'\u2014')}</div></div>`).join('')}</div>`:'';
  const map=(o.lat&&o.lng)?`<iframe class="map" loading="lazy" title="Map of ${esc(o.name)}"
    src="https://www.openstreetmap.org/export/embed.html?bbox=${o.lng-0.6},${o.lat-0.35},${o.lng+0.6},${o.lat+0.35}&layer=mapnik&marker=${o.lat},${o.lng}"></iframe>`:'';
  return `<article class="opt${wild?' wild':''}">
    <div class="band"><span>${wild?'The wildcard':'Option '+(i+1)}</span><span>${esc(o.shape||'')}</span></div>
    ${o.verified===false?`<div class="unver">Could not confirm this place has a Wikipedia entry &#8212; check it exists before you get excited.</div>`:''}
    ${gal}
    <div class="in">
      <h2>${esc(o.name)}</h2><div class="place">${esc(o.where)}</div>
      <p class="pitch">${esc(o.pitch)}</p>
      ${grid}
      ${o.versus?`<div class="vs"><div class="h">Against ${esc(o.versus.place||'somewhere you know')}</div><p>${esc(o.versus.text)}</p></div>`:''}
      <div class="sec"><div class="h">Why this one, for you</div><ul>${(o.fit||[]).map(f=>`<li>${esc(f)}</li>`).join('')}</ul></div>
      <div class="trade"><b>The trade-off.</b> ${esc(o.tradeoff)}</div>
      ${o.say?`<div class="say"><div class="h">When someone asks where you're going</div><p>&#8220;${esc(o.say)}&#8221;</p></div>`:''}
      <button class="fold" data-fold="${id}"><span>The practical &#8212; risks, checks, where it is</span><span class="c">+</span></button>
      <div class="folded" id="f-${id}">
        <div class="sec risk"><div class="h">What could spoil it &#8212; and the answer</div>
        <ul>${(o.risks||[]).map(r=>`<li><b>${esc(r.risk)}</b><span>${esc(r.answer)}</span></li>`).join('')}</ul></div>
        ${map}
        ${(o.check||[]).length?`<div class="check">Check before booking &#8212;<br>${o.check.map(c=>'&#183; '+esc(c)).join('<br>')}</div>`:''}
      </div>
    </div>
    <div class="short">
      <button data-sl="${esc(o.name)}" aria-pressed="${SHORT.has(o.name)}">${SHORT.has(o.name)?'Shortlisted':'Shortlist'}</button>
      <button data-open="${id}">Steer it</button>
    </div>
    <div class="tune t-${id}" style="display:none"><div class="h">Steer this one</div><div class="chips">
      ${TUNE.map(t=>`<button class="chip" data-t="${esc(o.name)}||${esc(t)}">${t}</button>`).join('')}</div></div>
  </article>`;
}

function results(d){
  app.innerHTML=`
  <div class="top"><div class="kicker">${esc(brief().window)}</div><h1>Three worth<br>arguing about.</h1></div>
  <div class="verdict"><div class="kicker">What it read in your brief</div><p>${esc(d.reading||'')}</p></div>
  ${snapshot(d)}
  ${(d.options||[]).map((o,i)=>card(o,i,false)).join('')}
  ${d.wildcard?card(d.wildcard,0,true):''}
  ${(d.ruledout||[]).length?`<div class="foot"><b>Ruled out on purpose.</b><br>${d.ruledout.map(r=>`${esc(r.name)} &#8212; ${esc(r.why)}`).join('<br>')}</div>`:''}
  <div class="blk" style="margin-top:22px">
    <div class="lab"><span class="n">&#8594;</span><h2>Anything else?</h2></div>
    <textarea id="fb" placeholder="The second looks too much like where we've already been. We'd go further for something genuinely different."></textarea>
    <button class="go" id="again" style="margin-top:12px">Try again with that</button>
  </div>
  <div class="foot"><b>None of this is checked yet.</b> Ages, opening dates, prices and crowds still need verifying with the operators. The check-before-booking lines are the ones that matter.</div>
  <div class="acts">
    <button onclick="navigator.clipboard.writeText(location.href).then(()=>alert('Link copied'))">Send to someone</button>
    <button onclick="form()">Change the brief</button>
  </div>`;
  const t=$('#snaptog'); if(t) t.onclick=()=>{SNAP=!SNAP;results(d);};
  $$('[data-fold]').forEach(b=>b.onclick=()=>{
    const el=document.getElementById('f-'+b.dataset.fold);
    b.querySelector('.c').textContent=el.classList.toggle('open')?'\u2212':'+';});
  $$('[data-sl]').forEach(b=>b.onclick=()=>{
    const n=b.dataset.sl;SHORT.has(n)?SHORT.delete(n):SHORT.add(n);results(d);});
  $$('[data-open]').forEach(b=>b.onclick=()=>{
    const el=document.querySelector('.t-'+b.dataset.open);
    el.style.display=el.style.display==='none'?'block':'none';});
  $$('[data-t]').forEach(b=>b.onclick=()=>{const[n,t]=b.dataset.t.split('||');run(`About ${n}: ${t}.`);});
  $('#again').onclick=()=>{const v=$('#fb').value.trim();if(v)run(v);};
  window.scrollTo(0,0);
}
window.form=form;form();
</script>
</body>
</html>
