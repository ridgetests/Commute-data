name: Collect rail

# National Rail / Darwin. Separate from the TfL collector on purpose: a different
# API, a different key, and it must be able to fail without taking the tube
# archive down with it.
#
# WHY THIS HAS A CLOCK: HSP gives you punctuality retrospectively, so reliability
# data can wait. But HSP does NOT keep PLATFORM history — Darwin publishes the
# platform, the train leaves, and it's gone. Every day this doesn't run is a day
# of platform allocations that can never be recovered.

on:
  schedule:
    # WHY NOT FOUR LONG JOBS: the obvious design is 4 x ~5h50m jobs to blanket
    # the day (GitHub caps a job at 6 hours). It failed silently for weeks. The
    # problem is GitHub delays scheduled triggers by 1.5-3.5h under load, and a
    # 340-min run leaves only ~20 min of slack before the next 6-hourly slot. A
    # delayed run therefore overlaps the next one; the concurrency group below
    # serialises them, and the collision eats a whole slot's collection window.
    # The SAME two slots got starved almost every day — including the one that
    # covers the 04-09 morning peak, so the busiest departures were never
    # observed enough to clear the model's confidence floor, and vanished from
    # the board.
    #
    # Fix: short runs, well inside the interval. Every 2h, ~100-min run = 20 min
    # of real slack, so a moderately delayed trigger still finishes before the
    # next slot and never collides. A dropped run now costs one 2h window, not a
    # cascade, and every slot — mornings included — collects every day. The
    # residual ~20-min gap drifts with GitHub's own start jitter, so no departure
    # sits in a permanent blind spot.
    - cron: "7 */2 * * *"
  workflow_dispatch: {}

# Still serialise (a straggler must not double-poll a station), but with runs
# now far shorter than the interval this queue almost never has anything in it.
concurrency:
  group: rail
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rail:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install

      - name: Collect Darwin boards
        run: npx tsx src/railPoll.ts
        env:
          RAIL_API_KEY: ${{ secrets.RAIL_API_KEY }}
          RUN_MINUTES: "100"
          POLL_SECONDS: "60"
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}

      - name: Commit
        if: always()
        run: |
          git config user.name "archive-bot"
          git config user.email "archive-bot@users.noreply.github.com"
          git add data
          git commit -m "rail $(date -u +%FT%TZ) [skip ci]" || echo "nothing new"
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && break
            git rebase --abort 2>/dev/null || true
          done
