name: Collect

on:
  # WHY NOT FOUR LONG JOBS: the original design was 4 x ~5h40m jobs (GitHub caps
  # a job at 6 hours) to blanket the day. It looked continuous but wasn't. GitHub
  # delays scheduled triggers by 1.5-3.5h under load, and a 340-min run leaves
  # only ~18 min of slack before the next 6-hourly slot — so delayed runs overlap,
  # the concurrency group serialises them, and the collision eats a whole slot.
  # Measured on the crowding log, the 12:07 slot collected almost nothing on most
  # days: the 15:00-19:00 evening peak, when disruption matters most, went dark.
  # (The rail collector had the identical bug; this is the same fix.)
  #
  # Short runs, well inside the interval: every 2h, ~100-min run = 20 min of real
  # slack, so a delayed trigger still finishes before the next slot. A dropped run
  # costs one 2h window, not a cascade, and every slot collects every day. As a
  # bonus the pit wall (rebuilt at the end of each run) now refreshes every 2h.
  schedule:
    - cron: "2 */2 * * *"
  workflow_dispatch: {}

# Still serialise (a straggler must not double-poll), but with runs now far
# shorter than the interval this queue almost never has anything in it.
concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install

      - name: Collect (events + run times + platforms)
        run: npx tsx src/poll.ts
        env:
          TFL_APP_KEY: ${{ secrets.TFL_APP_KEY }}
          # Cold archive. Without these the run still works — the MODEL is always
          # written to the repo — but the raw movements are discarded rather than
          # kept for future re-analysis.
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          RUN_MINUTES: "100"

      - name: Rebuild the public dashboard
        run: |
          git pull --rebase -X theirs || true
          npx tsx src/digest.ts

      - name: Commit the data
        if: always()
        run: |
          git config user.name "archive-bot"
          git config user.email "archive-bot@users.noreply.github.com"
          git add data docs
          git commit -m "collect $(date -u +%FT%TZ) [skip ci]" || echo "nothing new"
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && break
            git rebase --abort 2>/dev/null || true
          done
